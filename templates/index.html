<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" href="{{url_for('static', filename='css/indexStyle.css')}}" rel="stylesheet"/>
    <script src="static/js/indexScript.js"></script>
</head>

<body class="body">
    <main>
        <h1 class="h1_center">Приложение для медиков</h1><br>
        <div class="div_form">
            <form id="boxForUploadImage" class="box_for_upload_image" method="post" action="/loadImageToAlgorithms" enctype="multipart/form-data">
                <input class="box_file" type="file" name="file" accept=".jpg,.png,.jpeg" id="uploadFile" required>
                <label class="box_label" for="uploadFile" id="label"><span class="box_choose_file"><strong>Выберите файл</strong></span><span class="box_dragndrop">&nbsp;или перенесите его сюда</span>.</label>
                <div class="box_buttons">
                    <button class="input-submit" type="submit" name="load1">Загрузить изображение<br>в алгоритм </button>
                    <button class="input-submit" type="submit" name="load2" formaction="/loadImageToLines">Загрузить изображение<br>в линии</button>
                </div>
            </form>
        </div>
    </main>
</body></html>
