<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" href="{{url_for('static', filename='css/linesStyle.css')}}" rel="stylesheet"/>
    <script src="static/js/linesScript.js"></script>
</head>

<body>
    <main>
        <section>
            <a href="/">Вернуться на главную страницу</a>
            <a href="/algorithms/">Перейти к расчётам</a>
            <br>
            <div class="div_form">
                <img class="img-file" id="image" tabindex="-1" onmousedown="onKeyDown()" onmouseup="onKeyUp()" draggable="false" src="{{contours}}">
                <div class="buttons">
                    <button id="deleteLastResult" name="deleteLastResult" type="button" onclick="popThatButton()">Убрать последнюю линию</button>
                    <button id="deleteAll" name="deleteAll" type="button" onclick="deleteAllButton()">Убрать все линии</button>
                </div>
                <div class="results">
                    <h1>Результаты</h1>
                    <div class="line"></div>
                    <p class="">Линия</p>
                    <div class="content" id="LineInfo"> {{lineInfo}}</div>
                    <p class="lines_results">Линии</p>
                    <div class="content" id="LinesInfo"> {{linesInfo}}</div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
